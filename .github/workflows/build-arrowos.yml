name: Build ArrowOS Android12
run-name: Build ${{ github.event.inputs.DEVICE_NAME }} Android12
on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: ArrowOS 源码Manifest仓库
        required: true
        default: https://github.com/ArrowOS/android_manifest.git
      MANIFEST_BRANCH:
        description: ROM分支（安卓12固定arrow-12.1）
        required: true
        default: arrow-12.1
      DEVICE_NAME:
        description: 设备代号
        required: true
        default: sky
      DEVICE_PATH:
        description: 设备树路径
        required: true
        default: device/xiaomi/sky
      LUNCH_TARGET:
        description: Lunch编译名称
        required: true
        default: arrow_sky-userdebug

jobs:
  build-rom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 拉取仓库本地配置（roomservice内核配置）
      - name: 拉取本地仓库文件
        uses: actions/checkout@v4
        with:
          path: repo-tmp

      # 清理旧环境残留
      - name: 清理旧环境
        uses: rokibhasansagar/slimhub_actions@main

      # 创建工作目录
      - name: 创建源码工作目录
        run: |
          mkdir workspace
          cd workspace
          echo "workspace-folder=$(pwd)" >> $GITHUB_ENV

      # 源码缓存，大幅缩短二次同步时间
      - name: 缓存完整源码
        uses: actions/cache@v3
        with:
          path: ${{ env.workspace-folder }}/arrow
          key: arrowos-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.run_id }}

      # Android12 强制JDK11
      - name: 配置JDK11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      # 安装系统依赖【已删除失效 python-is-python2】
      - name: 安装系统依赖与Repo工具
        run: |
          sudo apt update -y
          sudo apt install git ccache python3 openssl curl -y
          # 安装官方repo工具
          sudo curl -L -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod a+x /usr/local/bin/repo
          # 配置ccache编译缓存
          mkdir -p ${{ env.workspace-folder }}/ccache
          echo "export USE_CCACHE=1" >> ~/.bashrc
          echo "export CCACHE_DIR=${{ env.workspace-folder }}/ccache" >> ~/.bashrc
          ccache -M 50G
        working-directory: ${{ env.workspace-folder }}

      # 源码同步（无fastgit，仅AOSP中科大镜像）
      - name: 初始化&同步源码（带实时日志）
        run: |
          cd ${{ env.workspace-folder }}
          mkdir -p arrow
          cd arrow
          git config --global url."https://mirrors.ustc.edu.cn/git/aosp/".insteadOf https://android.googlesource.com/
          repo init -u ${{ github.event.inputs.SYNC_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }} --no-repo-verify
          mkdir -p .repo/local_manifests
          cp ../../repo-tmp/local_manifests/roomservice.xml .repo/local_manifests/
          repo sync -j4 --force-sync --no-tags --no-clone-bundle --verbose
        working-directory: ${{ env.workspace-folder }}

      # 分配12G Swap交换内存
      - name: 分配12G Swap交换内存
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      # 编译ROM
      - name: 编译Android12 ROM
        run: |
          cd ${{ env.workspace-folder }}/arrow
          source build/envsetup.sh
          lunch ${{ github.event.inputs.LUNCH_TARGET }}
          m otapackage -j$(nproc)
        working-directory: ${{ env.workspace-folder }}
        continue-on-error: true

      # 列出刷机包
      - name: 查看编译产物
        run: |
          ls ${{ env.workspace-folder }}/arrow/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip

      # 自动发布Release
      - name: 发布刷机包到Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.workspace-folder }}/arrow/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
          tag_name: Build-${{ github.run_id }}
          name: ${{ github.event.inputs.DEVICE_NAME }} Android12 Build #${{ github.run_id }}
          body: |
            ROM版本：ArrowOS 12.1 (Android 12)
            内核基线：Linux 5.10 LTS
            设备代号：${{ github.event.inputs.DEVICE_NAME }}
            编译类型: userdebug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
