name: Build ArrowOS (arrow-12.1)

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: 'Manifest repository URL'
        required: true
        default: 'https://github.com/ArrowOS/android_manifest.git'
      branch:
        description: 'Manifest branch (do NOT change)'
        required: true
        default: 'arrow-12.1'
      device:
        description: 'Device codename'
        required: true
        default: 'sky'
      lunch_target:
        description: 'Lunch target'
        required: true
        default: 'arrow_sky-userdebug'

env:
  BUILD_DIR: ${{ github.workspace }}/android
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
      # 0. 检出仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 释放磁盘空间
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      # 2. 12G Swap分区
      - name: Configure 12GB swap (dd with /mnt fallback)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          SWAP_FILE=""
          echo "尝试根分区创建swap..."
          if sudo dd if=/dev/zero of=/swapfile bs=1M count=12288 status=progress; then
            SWAP_FILE="/swapfile"
          else
            sudo rm -f /swapfile
            sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=12288 status=progress
            SWAP_FILE="/mnt/swapfile"
          fi
          sudo chmod 600 "$SWAP_FILE"
          sudo mkswap "$SWAP_FILE"
          sudo swapon "$SWAP_FILE"
          echo "Swap文件：$SWAP_FILE"
          free -h

      # 3. JDK11
      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # 4. 编译依赖安装
      - name: Install build dependencies and repo
        run: |
          echo "deb http://archive.ubuntu.com/ubuntu jammy main universe" | sudo tee /etc/apt/sources.list.d/jammy.list
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses6 libncurses5 lib32ncurses-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig ccache rsync --allow-downgrades
          if ! sudo apt-get install -y repo; then
            sudo add-apt-repository -y ppa:git-core/ppa
            sudo apt-get update
            sudo apt-get install -y repo
          fi
          repo version
          git --version

      # 5. Git基础配置
      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false
          git config --global core.longpaths true
          git config --global safe.directory "*"
          # 使用GITHUB_TOKEN避免API限流
          git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf https://github.com/
          # 设置合理的超时
          git config --global http.timeout 30
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 30

      # 6. Repo初始化
      - name: Repo init (先官方直连，失败切换国内镜像)
        run: |
          OFFICIAL_REPO=https://gerrit.googlesource.com/git-repo
          TUNA_REPO=https://mirrors.tuna.tsinghua.edu.cn/git/git-repo
          USTC_REPO=https://mirrors.ustc.edu.cn/git/git-repo

          export REPO_URL=$OFFICIAL_REPO
          echo "【第一步】优先谷歌官方repo，2秒连通检测..."
          if curl --connect-timeout 2 -sI $OFFICIAL_REPO > /dev/null; then
            echo "官方repo访问正常，使用原生源"
          else
            echo "官方直连超时，切换清华repo镜像"
            export REPO_URL=$TUNA_REPO
            # 全局强制替换谷歌AOSP域名
            git config --global url."https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/".insteadOf https://android.googlesource.com/
            git config --global url."https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/".insteadOf git://android.googlesource.com/
            if ! curl --connect-timeout 2 -sI $TUNA_REPO > /dev/null; then
              echo "清华镜像失效，降级中科大repo"
              export REPO_URL=$USTC_REPO
              git config --global url."https://mirrors.ustc.edu.cn/aosp/".insteadOf https://android.googlesource.com/
            fi
          fi
          echo "最终生效REPO源：$REPO_URL"

          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          
          # 【修复】添加 -b 参数指定分支，移除 --depth=1
          repo init -u "${{ github.event.inputs.manifest_url }}" -b "${{ github.event.inputs.branch }}" --no-repo-verify
          
          echo "当前Manifest分支：$(cd .repo/manifests && git branch --show-current)"

      # 7. 导入设备本地清单并应用镜像
      - name: Copy and fix local manifests
        run: |
          cd "$BUILD_DIR"
          mkdir -p .repo/local_manifests
          
          if [ -d "${{ github.workspace }}/local_manifests" ]; then
            cp -v "${{ github.workspace }}/local_manifests/"*.xml .repo/local_manifests/
          fi
          
          # 【修复】对local_manifests也应用AOSP镜像替换
          if [ -f ".repo/local_manifests/roomservice.xml" ]; then
            echo "===== 原始roomservice.xml ====="
            cat .repo/local_manifests/roomservice.xml
            
            # 替换AOSP源为清华镜像（如果有）
            sed -i 's|https://android.googlesource.com|https://mirrors.tuna.tsinghua.edu.cn/git/AOSP|g' .repo/local_manifests/roomservice.xml
            sed -i 's|git://android.googlesource.com|https://mirrors.tuna.tsinghua.edu.cn/git/AOSP|g' .repo/local_manifests/roomservice.xml
            
            echo "===== 修复后的roomservice.xml ====="
            cat .repo/local_manifests/roomservice.xml
          else
            echo "警告：未找到roomservice.xml"
            # 如果设备是sky且没有roomservice，创建默认的
            if [ "${{ github.event.inputs.device }}" == "sky" ]; then
              cat > .repo/local_manifests/roomservice.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest>
              <project name="ArrowOS-Devices/android_kernel_xiaomi_sky"
                       path="kernel/xiaomi/sky"
                       remote="github"
                       revision="5.10-stable"/>
          </manifest>
          EOF
              echo "已创建默认roomservice.xml"
            fi
          fi
          
          echo "===== 所有local manifests ====="
          ls -la .repo/local_manifests/

      # 8. AOSP源码镜像替换
      - name: Apply AOSP mirror
        run: |
          cd "$BUILD_DIR"
          OFFICIAL_AOSP=https://android.googlesource.com
          TUNA_AOSP=https://mirrors.tuna.tsinghua.edu.cn/git/AOSP
          USTC_AOSP=https://mirrors.ustc.edu.cn/aosp

          echo "【第一步】优先纯谷歌官方原生AOSP直连，检测连通..."
          if curl --connect-timeout 2 -sI $OFFICIAL_AOSP > /dev/null; then
            echo "官方AOSP直连正常，保留原生地址不替换"
          else
            echo "官方直连超时无法访问，替换所有清单xml为清华镜像"
            # 【修复】替换所有.repo目录下的xml，包括local_manifests
            find .repo -name "*.xml" -type f -exec sed -i "s|$OFFICIAL_AOSP|$TUNA_AOSP|g" {} +
            if ! curl --connect-timeout 2 -sI $TUNA_AOSP > /dev/null; then
              echo "清华镜像不可用，降级中科大AOSP"
              find .repo -name "*.xml" -type f -exec sed -i "s|$TUNA_AOSP|$USTC_AOSP|g" {} +
            fi
          fi
          
          echo "===== 清单fetch地址预览 ====="
          echo "主manifest:"
          grep -r "fetch=" .repo/manifests/*.xml 2>/dev/null | head -5 || true
          echo "local_manifests:"
          grep -r "fetch=" .repo/local_manifests/*.xml 2>/dev/null | head -5 || true

      # 9. Repo sync (增强重试版)
      - name: Repo sync
        run: |
          cd "$BUILD_DIR"
          
          # 清理可能的锁文件
          rm -f .repo/project.list .repo/local_manifests/.cache 2>/dev/null || true
          
          for i in 1 2 3 4 5; do
            echo "===== 第$i次同步源码 ====="
            echo "开始时间：$(date)"
            
            # 【修复】降低并发到-j4，添加--fail-fast快速失败
            if repo sync -c -j4 --force-sync --no-tags --no-clone-bundle --prune --optimized-fetch --retry-fetches 5 --fail-fast; then
              echo "✅ 源码同步完成！"
              break
            fi
            
            SYNC_EXIT=$?
            echo "同步失败，退出码：$SYNC_EXIT"
            
            if [ "$i" -eq 5 ]; then
              echo "❌ 五次同步全部失败，终止构建"
              
              # 输出调试信息
              echo "===== 调试信息 ====="
              echo "1. 网络连接测试："
              curl -I --connect-timeout 5 https://github.com 2>&1 | head -3 || echo "GitHub不可达"
              curl -I --connect-timeout 5 https://mirrors.tuna.tsinghua.edu.cn 2>&1 | head -3 || echo "清华不可达"
              
              echo "2. 同步状态："
              repo status 2>&1 | head -20 || true
              
              echo "3. 已下载的项目："
              find .repo/projects -maxdepth 1 -type d | wc -l
              
              exit 1
            fi
            
            # 如果是GitHub限流(128)，等待更长时间
            if [ $SYNC_EXIT -eq 128 ]; then
              echo "检测到GitHub限流，等待120秒"
              sleep 120
            else
              echo "同步失败，等待60秒后重试"
              sleep 60
            fi
          done
          
          # 验证同步完整性
          if [ ! -f "build/envsetup.sh" ]; then
            echo "❌ 源码同步不完整，缺少核心文件"
            echo "检查build目录："
            ls -la build/ 2>/dev/null || echo "build目录不存在"
            exit 1
          fi
          echo "✅ 源码验证通过"

      # 10. 编译缓存配置
      - name: Setup ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          ccache -M 50G
          ccache -z

      # 11. 编译刷机包
      - name: Build ArrowOS
        run: |
          cd "$BUILD_DIR"
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="$CCACHE_DIR"
          source build/envsetup.sh
          lunch "${{ github.event.inputs.lunch_target }}"
          m otapackage -j4

      # 12. 查找输出刷机包
      - name: Find output OTA zip
        id: find_zip
        run: |
          DEVICE="${{ github.event.inputs.device }}"
          ZIP_PATH=$(find "$BUILD_DIR/out/target/product/$DEVICE" -maxdepth 1 -name "*.zip" -type f | head -1)
          if [ -z "$ZIP_PATH" ]; then
            echo "未找到OTA刷机包"
            ls -la "$BUILD_DIR/out/target/product/$DEVICE/" 2>/dev/null
            exit 1
          fi
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "zip_name=$(basename "$ZIP_PATH")" >> "$GITHUB_OUTPUT"
          echo "找到刷机包：$ZIP_PATH"
          ls -lh "$ZIP_PATH"

      # 13. 上传至Release
      - name: Upload OTA zip to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: arrowos-${{ github.event.inputs.device }}-${{ github.run_number }}
          name: ArrowOS ${{ github.event.inputs.device }} (${{ github.event.inputs.branch }}) #${{ github.run_number }}
          files: ${{ steps.find_zip.outputs.zip_path }}
          body: |
            ## ArrowOS 编译包
            - 设备代号：${{ github.event.inputs.device }}
            - 源码分支：${{ github.event.inputs.branch }}
            - Lunch编译目标：${{ github.event.inputs.lunch_target }}
            - 构建编号：${{ github.run_number }}
            - 仓库提交哈希：${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
