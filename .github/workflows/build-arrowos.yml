name: Build ArrowOS Android12
run-name: Build ${{ github.event.inputs.DEVICE_NAME }} Android12
on:
  workflow_dispatch:
    inputs:
      MIRROR:
        description: AOSP镜像源 ustc/ tuna
        required: true
        default: tuna
        type: choice
        options:
          - ustc
          - tuna
      SYNC_URL:
        description: Manifest仓库
        required: true
        default: https://github.com/ArrowOS/android_manifest.git
      MANIFEST_BRANCH:
        description: Android12分支
        required: true
        default: arrow-12.1
      DEVICE_NAME:
        description: 设备代号
        required: true
        default: sky
      LUNCH_TARGET:
        description: 编译目标
        required: true
        default: arrow_sky-userdebug

jobs:
  build-rom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取本地roomservice设备配置
        uses: actions/checkout@v4
        with:
          path: repo-tmp

      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /var/lib/apt/lists/*
          sudo apt clean

      - name: 创建编译目录
        run: |
          mkdir workspace
          echo "workspace-folder=$(pwd)/workspace" >> $GITHUB_ENV

      - name: 源码缓存
        uses: actions/cache@v3
        with:
          path: ${{ env.workspace-folder }}/arrow
          key: arrow-${{ github.event.inputs.MIRROR }}-${{ github.event.inputs.MANIFEST_BRANCH }}
          restore-keys: |
            arrow-${{ github.event.inputs.MIRROR }}-

      - name: 安装JDK11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: 安装依赖 & apt安装repo（无curl 404问题）
        run: |
          sudo apt update -y
          # 直接通过apt官方源安装repo，完全避开curl下载链接失效问题
          sudo apt install git ccache python3 openssl curl repo -y
          
          git config --global core.protectNTFS false
          git config --global safe.directory "*"
          git config --global core.longpaths true
          git config --global user.name "CI Builder"
          git config --global user.email "builder@action.local"

          # AOSP国内镜像加速
          if [[ "${{ github.event.inputs.MIRROR }}" == "ustc" ]]; then
            export AOSP_MIRROR=https://mirrors.ustc.edu.cn/aosp/
          else
            export AOSP_MIRROR=https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/
          fi
          git config --global url."$AOSP_MIRROR".insteadOf https://android.googlesource.com/
        working-directory: ${{ env.workspace-folder }}

      - name: 初始化+同步源码
        run: |
          SYNC_URL="${{ github.event.inputs.SYNC_URL }}"
          BRANCH="${{ github.event.inputs.MANIFEST_BRANCH }}"
          cd ${{ env.workspace-folder }}
          rm -rf arrow
          mkdir arrow && cd arrow

          repo init -u "$SYNC_URL" -b "$BRANCH"
          cd .repo/manifests
          git checkout "$BRANCH"
          cd ../../

          mkdir -p .repo/local_manifests
          cp -f ../../repo-tmp/local_manifests/roomservice.xml .repo/local_manifests/

          MAX_RETRY=5
          SUCCESS=0
          for ((i=1;i<=MAX_RETRY;i++)); do
            echo "第$i次同步源码"
            repo sync -j1 --force-sync --no-tags --no-clone-bundle --retry-fetches=10
            if [ $? -eq 0 ]; then SUCCESS=1;break;fi
            sleep 20
          done
          [ $SUCCESS -ne 1 ] && exit 1
          [ ! -f build/envsetup.sh ] && exit 1

      - name: 12G虚拟内存
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: 编译刷机包
        run: |
          cd ${{ env.workspace-folder }}/arrow
          source build/envsetup.sh
          lunch ${{ github.event.inputs.LUNCH_TARGET }}
          m otapackage -j4

      - name: 列出刷机包
        run: ls ${{ env.workspace-folder }}/arrow/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip

      - name: 发布成品
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          files: ${{ env.workspace-folder }}/arrow/out/target/product/${{ env.DEVICE_NAME }}/*.zip
          tag_name: Arrow12-Build-${{ github.run_number }}
          name: ArrowOS12 Build ${{ github.run_number }}
          generate_release_notes: true
