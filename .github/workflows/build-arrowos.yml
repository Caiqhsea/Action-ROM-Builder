name: Build ArrowOS Android12
run-name: Build ${{ github.event.inputs.DEVICE_NAME }} Android12
on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: ArrowOS Manifest仓库
        required: true
        default: https://github.com/ArrowOS/android_manifest.git
      MANIFEST_BRANCH:
        description: ROM分支 arrow-12.1
        required: true
        default: arrow-12.1
      DEVICE_NAME:
        description: 设备代号
        required: true
        default: sky
      DEVICE_PATH:
        description: 设备树路径
        required: true
        default: device/xiaomi/sky
      LUNCH_TARGET:
        description: Lunch编译名称
        required: true
        default: arrow_sky-userdebug

jobs:
  build-rom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取本地roomservice配置
        uses: actions/checkout@v4
        with:
          path: repo-tmp

      - name: 深度清理磁盘释放空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /var/lib/apt/lists/*
          sudo apt clean
          df -h

      - name: 创建工作目录
        run: |
          mkdir workspace
          cd workspace
          echo "workspace-folder=$(pwd)" >> $GITHUB_ENV

      - name: 缓存源码（同分支复用，大幅减少同步次数）
        uses: actions/cache@v3
        with:
          path: ${{ env.workspace-folder }}/arrow
          key: arrowos-${{ github.event.inputs.MANIFEST_BRANCH }}
          restore-keys: |
            arrowos-${{ github.event.inputs.MANIFEST_BRANCH }}

      - name: 配置JDK11（Android12强制要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: 安装依赖 & 多备用地址下载repo，无国内镜像/代理
        run: |
          sudo apt update -y
          sudo apt install git ccache python3 openssl curl -y
          # 多备用官方地址循环下载repo，解决curl exit code 5
          download_repo() {
            rm -f repo
            # 谷歌官方备用域名，无国内中转
            curl -fL https://gerrit.googlesource.com/git-repo/+/refs/heads/main/repo?format=TEXT | base64 -d > repo
          }
          MAX_DL=3
          for ((i=1; i<=MAX_DL; i++)); do
            echo "尝试第$i次下载repo工具"
            if download_repo; then
              break
            fi
            echo "下载失败，等待30秒重试"
            sleep 30
          done
          if [ ! -f repo ]; then
            echo "repo工具下载多次失败，终止任务"
            exit 1
          fi
          chmod a+x repo
          sudo mv repo /usr/local/bin/
          # git基础配置，彻底清空中科大镜像映射
          git config --global user.name "CI Builder"
          git config --global user.email "ci@build.local"
          git config --global --unset-all url."https://mirrors.ustc.edu.cn/aosp/".insteadOf || true
          # ccache编译缓存
          mkdir -p ${{ env.workspace-folder }}/ccache
          echo "export USE_CCACHE=1" >> ~/.bashrc
          echo "export CCACHE_DIR=${{ env.workspace-folder }}/ccache" >> ~/.bashrc
          ccache -M 50G
        working-directory: ${{ env.workspace-folder }}

      - name: 初始化&同步源码（纯谷歌原生源，单线程低压力）
        run: |
          cd ${{ env.workspace-folder }}
          mkdir -p arrow
          cd arrow
          repo init -u ${{ github.event.inputs.SYNC_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }} --no-repo-verify --depth=1
          mkdir -p .repo/local_manifests
          cp ../../repo-tmp/local_manifests/roomservice.xml .repo/local_manifests/
          
          MAX_RETRY=5
          for ((i=1; i<=MAX_RETRY; i++)); do
            echo "==================== 第$i次同步尝试 ===================="
            repo sync -j1 --force-sync --no-tags --no-clone-bundle --retry-fetches=15
            if [ $? -eq 0 ]; then
              echo "✅ 源码同步完成"
              exit 0
            fi
            echo "❌ 源访问限流，等待90秒超长冷却后重试"
            sleep 90
          done
          echo "❌ 5次同步全部失败，任务终止"
          exit 1
        working-directory: ${{ env.workspace-folder }}

      - name: 分配12G Swap 防止编译内存溢出
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: 编译ROM（低并发j4避免OOM）
        run: |
          cd ${{ env.workspace-folder }}/arrow
          source build/envsetup.sh
          lunch ${{ github.event.inputs.LUNCH_TARGET }}
          m otapackage -j4
        working-directory: ${{ env.workspace-folder }}

      - name: 列出编译刷机包
        run: ls ${{ env.workspace-folder }}/arrow/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip

      - name: 自动发布Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.workspace-folder }}/arrow/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
          tag_name: Build-${{ github.run_id }}
          name: ${{ github.event.inputs.DEVICE_NAME }} Android12 Build #${{ github.run_id }}
          body: |
            ROM：ArrowOS 12.1 Android12
            设备代号：${{ github.event.inputs.DEVICE_NAME }}
            编译类型：userdebug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
