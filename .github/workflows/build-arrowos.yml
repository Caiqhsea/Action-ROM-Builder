name: Build ArrowOS Android12
run-name: Build ${{ github.event.inputs.DEVICE_NAME }} Android12
on:
  workflow_dispatch:
    inputs:
      MIRROR:
        description: 镜像源选择 ustc(中科大) / tuna(清华)
        required: true
        default: tuna
        type: choice
        options:
          - ustc
          - tuna
      SYNC_URL:
        description: ArrowOS Manifest仓库（必须带.git后缀）
        required: true
        default: https://github.com/ArrowOS/android_manifest.git
      MANIFEST_BRANCH:
        description: Android12 固定分支 arrow-12.1
        required: true
        default: arrow-12.1
      DEVICE_NAME:
        description: 设备代号
        required: true
        default: sky
      LUNCH_TARGET:
        description: lunch 编译目标
        required: true
        default: arrow_sky-userdebug

jobs:
  build-rom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取本地roomservice配置
        uses: actions/checkout@v4
        with:
          path: repo-tmp

      - name: 深度清理系统磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /var/lib/apt/lists/*
          sudo apt clean

      - name: 初始化工作目录
        run: |
          mkdir workspace
          echo "workspace-folder=$(pwd)/workspace" >> $GITHUB_ENV

      - name: 源码缓存持久化
        uses: actions/cache@v3
        with:
          path: ${{ env.workspace-folder }}/arrow
          key: arrow-${{ github.event.inputs.MIRROR }}-${{ github.event.inputs.MANIFEST_BRANCH }}
          restore-keys: |
            arrow-${{ github.event.inputs.MIRROR }}-

      - name: 配置JDK11（Android12强制依赖）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: 安装依赖 + 配置国内镜像源
        run: |
          sudo apt update -y
          sudo apt install git ccache python3 openssl curl -y
          git config --global core.protectNTFS false
          git config --global safe.directory "*"
          git config --global core.longpaths true

          if [[ "${{ github.event.inputs.MIRROR }}" == "ustc" ]]; then
            export AOSP_MIRROR=https://mirrors.ustc.edu.cn/aosp/
            export REPO_URL=https://mirrors.ustc.edu.cn/git/git-repo
          else
            export AOSP_MIRROR=https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/
            export REPO_URL=https://mirrors.tuna.tsinghua.edu.cn/git/git-repo
          fi
          echo "REPO_URL=$REPO_URL" >> $GITHUB_ENV

          # 三段下载源：清华→中科大→谷歌直连，每个源重试5次，间隔8秒
          download_repo(){
            rm -f repo
            # 1.清华镜像 最多5次
            echo "=== 尝试【清华镜像】下载repo，最多5次 ==="
            for t in {1..5}; do
              echo "清华第${t}次尝试"
              curl -fL https://mirrors.tuna.tsinghua.edu.cn/git/git-repo/raw/main/repo -o repo
              if [ -f repo ]; then return 0; fi
              sleep 8
            done
            rm -f repo

            # 2.中科大镜像 最多5次
            echo "=== 清华全部失败，切换【中科大镜像】最多5次 ==="
            for t in {1..5}; do
              echo "中科大第${t}次尝试"
              curl -fL https://mirrors.ustc.edu.cn/git/git-repo/raw/main/repo -o repo
              if [ -f repo ]; then return 0; fi
              sleep 8
            done
            rm -f repo

            # 3.谷歌官方直连 最多5次
            echo "=== 国内镜像全部失败，切换【谷歌直连】最多5次 ==="
            for t in {1..5}; do
              echo "谷歌直连第${t}次尝试"
              curl -fL https://gerrit.googlesource.com/git-repo/+/refs/heads/main/repo?format=RAW -o repo
              if [ -f repo ]; then return 0; fi
              sleep 8
            done
            return 1
          }

          # 执行下载
          if ! download_repo; then
            echo "ERROR：清华/中科大/谷歌直连各5次全部失败，终止构建"
            exit 1
          fi

          chmod +x repo
          sudo mv repo /usr/local/bin/

          git config --global user.name "CI Builder"
          git config --global user.email "builder@action.local"
          git config --global url."$AOSP_MIRROR".insteadOf https://android.googlesource.com/
          echo "export REPO_URL=$REPO_URL" >> ~/.bashrc
        working-directory: ${{ env.workspace-folder }}

      - name: 初始化&同步源码
        run: |
          export REPO_URL=${{ env.REPO_URL }}
          SYNC_URL="${{ github.event.inputs.SYNC_URL }}"
          BRANCH="${{ github.event.inputs.MANIFEST_BRANCH }}"

          echo "Manifest地址: $SYNC_URL"
          echo "源码分支: $BRANCH"

          cd ${{ env.workspace-folder }}
          rm -rf arrow
          mkdir arrow
          cd arrow

          repo init -u "$SYNC_URL"
          cd .repo/manifests
          git checkout "$BRANCH"
          cd ../../

          mkdir -p .repo/local_manifests
          cp -f ../../repo-tmp/local_manifests/roomservice.xml .repo/local_manifests/

          # 源码同步最多5次，间隔20秒
          MAX_RETRY=5
          sync_ok=0
          for ((i=1; i<=MAX_RETRY; i++)); do
            echo "===== 第$i次源码同步 ====="
            repo sync -j1 --force-sync --no-tags --no-clone-bundle --retry-fetches=15
            if [ $? -eq 0 ]; then
              echo "✅ 源码同步完成"
              sync_ok=1
              break
            fi
            echo "同步失败，等待20s重试"
            sleep 20
          done

          if [ $sync_ok -ne 1 ]; then
            echo "ERROR：5次源码同步全部失败，终止构建"
            exit 1
          fi

          ls -la
          if [ ! -f build/envsetup.sh ]; then
            echo "❌ 源码缺失 build/envsetup.sh"
            exit 1
          fi
          echo "✅ 源码校验通过"

      - name: 分配12G Swap，防止编译内存溢出
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: 编译ROM
        run: |
          cd ${{ env.workspace-folder }}/arrow
          source build/envsetup.sh
          lunch ${{ github.event.inputs.LUNCH_TARGET }}
          m otapackage -j4

      - name: 列出刷机包
        run: ls ${{ env.workspace-folder }}/arrow/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip

      - name: 自动发布Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.workspace-folder }}/arrow/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
          tag_name: build-${{ github.event.inputs.MIRROR }}-${{ github.run_id }}
          name: ${{ github.event.inputs.DEVICE_NAME }} Android12 构建 #${{ github.run_id }}
          body: |
            镜像源：${{ github.event.inputs.MIRROR == 'ustc' && '中科大USTC' || '清华TUNA' }}
            设备：${{ github.event.inputs.DEVICE_NAME }}
            分支：${{ github.event.inputs.MANIFEST_BRANCH }}
