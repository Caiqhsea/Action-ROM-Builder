name: Build ArrowOS ROM

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'ArrowOS manifest 源码地址'
        required: true
        default: 'https://github.com/ArrowOS/android_manifest.git'
      MANIFEST_BRANCH:
        description: '源码分支'
        required: true
        default: 'arrow-13.1'
      DEVICE_PATH:
        description: '设备树路径'
        required: true
        default: 'device/xiaomi/sky'
      DEVICE_NAME:
        description: '设备代号'
        required: true
        default: 'sky'
      MAKEFILE_NAME:
        description: 'lunch编译名称'
        required: true
        default: 'arrow_sky'

jobs:
  build-arrowos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    # 拉取仓库本地roomservice
    - name: 拉取本地配置文件
      uses: actions/checkout@v4
      with:
        path: repo-tmp

    # 权限校验
    - name: 校验操作者为仓库所有者
      if: github.actor == github.repository_owner
      run: echo "校验通过，开始编译流程"

    - name: 非所有者终止任务
      if: github.actor != github.repository_owner
      run: |
        echo "仅仓库拥有者可运行编译"
        exit 1

    # 清理环境
    - name: 清理旧环境残留
      uses: rokibhasansagar/slimhub_actions@main

    # 创建工作目录
    - name: 创建工作目录
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
      id: pwd

    # 源码缓存
    - name: 缓存源码目录
      uses: actions/cache@v3
      with:
        path: ${{ steps.pwd.outputs.workspace-folder }}/arrow
        key: arrowos-${{ github.event.inputs.MANIFEST_BRANCH }}

    # Java环境
    - name: 配置JDK22
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 22

    # 安装依赖与repo工具
    - name: 安装编译依赖
      run: |
        sudo apt update && sudo apt install git ccache -y
        sudo curl -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
        sudo chmod +x /usr/local/bin/repo
        mkdir -p ${{ steps.pwd.outputs.workspace-folder }}/ccache
        echo "export USE_CCACHE=1" >> ~/.bashrc
        echo "export CCACHE_DIR=${{ steps.pwd.outputs.workspace-folder }}/ccache" >> ~/.bashrc
        ccache -M 50G
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    # 同步源码【重点：彻底删掉fastgit，只保留AOSP镜像】
    - name: 初始化并同步源码
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}
        mkdir -p arrow
        cd arrow
        # 仅AOSP官方源码走中科大镜像，GitHub仓库完全不做任何镜像替换
        git config --global url."https://mirrors.ustc.edu.cn/git/aosp/".insteadOf https://android.googlesource.com/
        # 初始化manifest
        repo init -u ${{ github.event.inputs.SYNC_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
        # 复制本地设备清单
        mkdir -p .repo/local_manifests
        cp ../../repo-tmp/local_manifests/roomservice.xml .repo/local_manifests/
        # 同步，verbose打印实时日志，线程4降低拥堵
        repo sync -j4 --force-sync --no-tags --no-clone-bundle --verbose
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    # 12G交换内存
    - name: 分配12G Swap内存
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    # 编译ROM
    - name: 编译ArrowOS刷机包
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/arrow
        . build/envsetup.sh
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}
        m otapackage
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      continue-on-error: true

    # 输出文件列表
    - name: 查看编译产物
      run: |
        ls ${{ steps.pwd.outputs.workspace-folder }}/arrow/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip

    # 自动发布Release
    - name: 上传刷机包至Release
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ steps.pwd.outputs.workspace-folder }}/arrow/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
        tag_name: ${{ github.run_id }}
        name: ${{ github.event.inputs.DEVICE_NAME }} Build ${{ github.run_id }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
