name: Build ArrowOS (arrow-12.1)

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: 'Manifest repository URL'
        required: true
        default: 'https://github.com/ArrowOS/android_manifest.git'
      branch:
        description: 'Manifest branch (do NOT change)'
        required: true
        default: 'arrow-12.1'
      device:
        description: 'Device codename'
        required: true
        default: 'sky'
      lunch_target:
        description: 'Lunch target'
        required: true
        default: 'arrow_sky-userdebug'

env:
  BUILD_DIR: ${{ github.workspace }}/android
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
      # 0. 检出仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 释放磁盘空间
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      # 2. 12G Swap分区
      - name: Configure 12GB swap (dd with /mnt fallback)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          SWAP_FILE=""
          echo "尝试根分区创建swap..."
          if sudo dd if=/dev/zero of=/swapfile bs=1M count=12288 status=progress; then
            SWAP_FILE="/swapfile"
          else
            sudo rm -f /swapfile
            sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=12288 status=progress
            SWAP_FILE="/mnt/swapfile"
          fi
          sudo chmod 600 "$SWAP_FILE"
          sudo mkswap "$SWAP_FILE"
          sudo swapon "$SWAP_FILE"
          echo "Swap文件：$SWAP_FILE"
          free -h

      # 3. JDK11
      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # 4. 编译依赖安装
      - name: Install build dependencies and repo
        run: |
          echo "deb http://archive.ubuntu.com/ubuntu jammy main universe" | sudo tee /etc/apt/sources.list.d/jammy.list
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses6 libncurses5 lib32ncurses-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig ccache rsync --allow-downgrades
          if ! sudo apt-get install -y repo; then
            sudo add-apt-repository -y ppa:git-core/ppa
            sudo apt-get update
            sudo apt-get install -y repo
          fi
          repo version
          git --version

      # 5. Git基础配置
      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false
          git config --global core.longpaths true
          git config --global safe.directory "*"
          # 降低git超时，网络差快速失败
          git config --global http.timeout 10

      # 6. Repo初始化逻辑：先官方原生源，2秒超时立刻切国内repo
      - name: Repo init (先官方直连，失败切换国内镜像)
        run: |
          OFFICIAL_REPO=https://gerrit.googlesource.com/git-repo
          TUNA_REPO=https://mirrors.tuna.tsinghua.edu.cn/git/git-repo
          USTC_REPO=https://mirrors.ustc.edu.cn/git/git-repo

          export REPO_URL=$OFFICIAL_REPO
          echo "【第一步】优先谷歌官方repo，2秒连通检测..."
          # 超时改为2秒，更快切换镜像
          if curl --connect-timeout 2 -sI $OFFICIAL_REPO > /dev/null; then
            echo "官方repo访问正常，使用原生源"
          else
            echo "官方直连超时，切换清华repo镜像"
            export REPO_URL=$TUNA_REPO
            if ! curl --connect-timeout 2 -sI $TUNA_REPO > /dev/null; then
              echo "清华镜像失效，降级中科大repo"
              export REPO_URL=$USTC_REPO
            fi
          fi
          echo "最终生效REPO源：$REPO_URL"

          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          repo init -u "${{ github.event.inputs.manifest_url }}" --depth=1 --no-repo-verify
          cd .repo/manifests
          git fetch origin "${{ github.event.inputs.branch }}"
          git checkout "${{ github.event.inputs.branch }}"
          echo "当前Manifest分支：$(git branch --show-current)"

      # 7. 导入设备本地清单
      - name: Copy local manifests
        run: |
          if [ -d "${{ github.workspace }}/local_manifests" ]; then
            mkdir -p "$BUILD_DIR/.repo/local_manifests"
            cp -v "${{ github.workspace }}/local_manifests/"*.xml "$BUILD_DIR/.repo/local_manifests/"
            ls -la "$BUILD_DIR/.repo/local_manifests/"
          else
            echo "警告：未检测到local_manifests文件夹"
          fi

      # 8. AOSP源码镜像：2秒检测官方源，不通切清华
      - name: Apply AOSP mirror (先原生官方直连，失败切换国内源)
        run: |
          cd "$BUILD_DIR"
          OFFICIAL_AOSP=https://android.googlesource.com
          TUNA_AOSP=https://mirrors.tuna.tsinghua.edu.cn/git/AOSP
          USTC_AOSP=https://mirrors.ustc.edu.cn/aosp

          echo "【第一步】优先谷歌官方AOSP，2秒连通检测..."
          if curl --connect-timeout 2 -sI $OFFICIAL_AOSP > /dev/null; then
            echo "官方AOSP直连正常，保留原生地址不替换"
          else
            echo "官方直连超时，切换清华国内镜像"
            find .repo/manifests -name "*.xml" -exec sed -i "s|$OFFICIAL_AOSP|$TUNA_AOSP|g" {} +
            if ! curl --connect-timeout 2 -sI $TUNA_AOSP > /dev/null; then
              echo "清华镜像不可用，降级中科大AOSP"
              find .repo/manifests -name "*.xml" -exec sed -i "s|$TUNA_AOSP|$USTC_AOSP|g" {} +
            fi
          fi
          grep -r "fetch=" .repo/manifests/*.xml | head -10 || true

      # 9. 高速同步源码：去掉代理、降低并发-j8、增加稳定参数
      - name: Repo sync (无代理稳定同步)
        run: |
          cd "$BUILD_DIR"
          for i in 1 2 3; do
            echo "===== 第$i次同步源码 ====="
            # -j8 更适配Action带宽，--retry-fetches 自动重试拉取失败仓库
            if repo sync -c -j8 --force-sync --no-tags --no-clone-bundle --prune --optimized-fetch --retry-fetches 3; then
              echo "源码同步完成"
              break
            fi
            if [ "$i" -eq 3 ]; then
              echo "3次同步全部失败，终止任务"
              exit 1
            fi
            echo "同步异常，等待45秒重试"
            sleep 45
          done
          if [ ! -f "build/envsetup.sh" ]; then
            echo "源码同步不完整，缺少核心文件"
            exit 1
          fi

      # 10. 编译缓存配置
      - name: Setup ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          ccache -M 50G
          ccache -z

      # 11. 编译刷机包
      - name: Build ArrowOS
        run: |
          cd "$BUILD_DIR"
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="$CCACHE_DIR"
          source build/envsetup.sh
          lunch "${{ github.event.inputs.lunch_target }}"
          m otapackage -j4

      # 12. 查找输出刷机包
      - name: Find output OTA zip
        id: find_zip
        run: |
          DEVICE="${{ github.event.inputs.device }}"
          ZIP_PATH=$(find "$BUILD_DIR/out/target/product/$DEVICE" -maxdepth 1 -name "*.zip" -type f | head -1)
          if [ -z "$ZIP_PATH" ]; then
            echo "未找到OTA刷机包"
            ls -la "$BUILD_DIR/out/target/product/$DEVICE/" 2>/dev/null
            exit 1
          fi
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "zip_name=$(basename "$ZIP_PATH")" >> "$GITHUB_OUTPUT"
          echo "找到刷机包：$ZIP_PATH"
          ls -lh "$ZIP_PATH"

      # 13. 上传至Release
      - name: Upload OTA zip to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: arrowos-${{ github.event.inputs.device }}-${{ github.run_number }}
          name: ArrowOS ${{ github.event.inputs.device }} (${{ github.event.inputs.branch }}) #${{ github.run_number }}
          files: ${{ steps.find_zip.outputs.zip_path }}
          body: |
            ## ArrowOS 编译包
            - 设备代号：${{ github.event.inputs.device }}
            - 源码分支：${{ github.event.inputs.branch }}
            - Lunch编译目标：${{ github.event.inputs.lunch_target }}
            - 构建编号：${{ github.run_number }}
            - 仓库提交哈希：${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
