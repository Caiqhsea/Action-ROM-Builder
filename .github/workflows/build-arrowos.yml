name: Build ArrowOS Android12
run-name: Build ${{ github.event.inputs.DEVICE_NAME }} Android12
on:
  workflow_dispatch:
    inputs:
      MIRROR:
        description: 镜像源选择 ustc(中科大) / tuna(清华)
        required: true
        default: ustc
        type: choice
        options:
          - ustc
          - tuna
      SYNC_URL:
        description: ArrowOS Manifest仓库（必须带.git后缀）
        required: true
        default: https://github.com/ArrowOS/android_manifest.git
      MANIFEST_BRANCH:
        description: Android12 固定分支 arrow-12.1
        required: true
        default: arrow-12.1
      DEVICE_NAME:
        description: 设备代号
        required: true
        default: sky
      LUNCH_TARGET:
        description: lunch 编译目标
        required: true
        default: arrow_sky-userdebug

jobs:
  build-rom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取本地roomservice配置
        uses: actions/checkout@v4
        with:
          path: repo-tmp

      - name: 深度清理系统磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /var/lib/apt/lists/*
          sudo apt clean

      - name: 初始化工作目录
        run: |
          mkdir workspace
          echo "workspace-folder=$(pwd)/workspace" >> $GITHUB_ENV

      - name: 源码缓存持久化
        uses: actions/cache@v3
        with:
          path: ${{ env.workspace-folder }}/arrow
          key: arrow-${{ github.inputs.MIRROR }}-${{ github.inputs.MANIFEST_BRANCH }}
          restore-keys: |
            arrow-${{ github.inputs.MIRROR }}-

      - name: 配置JDK11（Android12强制依赖）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: 安装依赖 + 配置国内镜像源
        run: |
          sudo apt update -y
          sudo apt install git ccache python3 openssl curl -y
          # 彻底放开git安全路径拦截
          git config --global core.protectNTFS false
          git config --global safe.directory "*"
          git config --global core.longpaths true

          # 镜像地址修正（修复中科大repo失效地址）
          if [[ "${{ github.inputs.MIRROR }}" == "ustc" ]]; then
            export REPO_DL=https://mirrors.ustc.edu.cn/git/git-repo/repo
            export AOSP_MIRROR=https://mirrors.ustc.edu.cn/aosp/
            export REPO_URL=https://mirrors.ustc.edu.cn/git/git-repo
          else
            export REPO_DL=https://mirrors.tuna.tsinghua.edu.cn/git/git-repo
            export AOSP_MIRROR=https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/
            export REPO_URL=https://mirrors.tuna.tsinghua.edu.cn/git/git-repo
          fi
          echo "REPO_URL=$REPO_URL" >> $GITHUB_ENV

          # 下载repo工具，3次重试
          download_repo(){
            rm -f repo
            curl -fL $REPO_DL -o repo
          }
          for i in {1..3}; do
            if download_repo; then break; fi
            echo "repo工具下载失败，等待30秒重试"
            sleep 30
          done
          chmod +x repo
          sudo mv repo /usr/local/bin/

          # AOSP源码镜像转发
          git config --global user.name "CI Builder"
          git config --global user.email "builder@action.local"
          git config --global url."$AOSP_MIRROR".insteadOf https://android.googlesource.com/
          echo "export REPO_URL=$REPO_URL" >> ~/.bashrc
        working-directory: ${{ env.workspace-folder }}

      - name: 初始化&同步源码（无额外参数，规避git拦截）
        run: |
          export REPO_URL=${{ env.REPO_URL }}
          cd ${{ env.workspace-folder }}
          rm -rf arrow
          mkdir arrow
          cd arrow
          # 核心修复：repo init 只保留 -u，删除所有额外参数避免被git拦截
          repo init -u ${{ github.inputs.SYNC_URL }}
          # 手动切分支
          cd .repo/manifests
          git checkout ${{ github.inputs.MANIFEST_BRANCH }}
          cd ../../

          # 加载本地设备树xml
          mkdir -p .repo/local_manifests
          cp -f ../../repo-tmp/local_manifests/roomservice.xml .repo/local_manifests/

          # 5次同步重试，单线程防限流
          MAX_RETRY=5
          for ((i=1; i<=MAX_RETRY; i++)); do
            echo "===== 第$i次源码同步尝试 ====="
            repo sync -j1 --force-sync --no-tags --no-clone-bundle --retry-fetches=15
            if [ $? -eq 0 ]; then
              echo "✅ 同步命令执行完成"
              break
            fi
            echo "同步失败，等待90秒冷却后重试"
            sleep 90
          done

          # 校验源码完整性，防止build/envsetup.sh缺失
          echo "当前源码根目录文件列表："
          ls -la
          if [ ! -f build/envsetup.sh ]; then
            echo "❌ 致命错误：源码不完整，缺少 build/envsetup.sh"
            exit 1
          fi
          echo "✅ 源码完整性校验通过"

      - name: 分配12G Swap 内存，防止编译OOM崩溃
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: 编译ROM（低并发j4）
        run: |
          cd ${{ env.workspace-folder }}/arrow
          ls -la
          source build/envsetup.sh
          lunch ${{ github.inputs.LUNCH_TARGET }}
          m otapackage -j4

      - name: 列出编译输出刷机包
        run: ls ${{ env.workspace-folder }}/arrow/out/target/product/${{ github.inputs.DEVICE_NAME }}/*.zip

      - name: 自动发布构建包Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.workspace-folder }}/arrow/out/target/product/${{ github.inputs.DEVICE_NAME }}/*.zip
          tag_name: build-${{ github.inputs.MIRROR }}-${{ github.run_id }}
          name: ${{ github.inputs.DEVICE_NAME }} Android12 构建 #${{ github.run_id }}
          body: |
            构建镜像源：${{ github.inputs.MIRROR == 'ustc' && '中科大USTC' || '清华TUNA' }}
            设备代号：${{ github.inputs.DEVICE_NAME }}
            源码分支：${{ github.inputs.MANIFEST_BRANCH }}
