name: Build ArrowOS Android12
run-name: Build ${{ github.event.inputs.DEVICE_NAME }} Android12
on:
  workflow_dispatch:
    inputs:
      MIRROR:
        description: 镜像源选择 ustc(中科大) / tuna(清华)
        required: true
        default: ustc
        type: choice
        options:
          - ustc
          - tuna
      SYNC_URL:
        description: ArrowOS Manifest仓库（必须带.git）
        required: true
        default: https://github.com/ArrowOS/android_manifest.git
      MANIFEST_BRANCH:
        description: Android12分支 arrow-12.1
        required: true
        default: arrow-12.1
      DEVICE_NAME:
        description: 设备代号
        required: true
        default: sky
      LUNCH_TARGET:
        description: lunch 编译目标
        required: true
        default: arrow_sky-userdebug

jobs:
  build-rom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取本地roomservice配置
        uses: actions/checkout@v4
        with:
          path: repo-tmp

      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /var/lib/apt/lists/*
          sudo apt clean

      - name: 创建工作目录
        run: |
          mkdir workspace
          echo "workspace-folder=$(pwd)/workspace" >> $GITHUB_ENV

      - name: 源码缓存
        uses: actions/cache@v3
        with:
          path: ${{ env.workspace-folder }}/arrow
          key: arrow-${{ github.inputs.MIRROR }}-${{ github.inputs.MANIFEST_BRANCH }}

      - name: JDK11 配置
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: 安装依赖 + 配置国内镜像
        run: |
          sudo apt update -y
          sudo apt install git ccache python3 openssl curl -y

          # 根据输入选择镜像源
          if [[ "${{ github.inputs.MIRROR }}" == "ustc" ]]; then
            export REPO_DL=https://mirrors.ustc.edu.cn/git/git-repo/git-repo/repo
            export AOSP_MIRROR=https://mirrors.ustc.edu.cn/aosp/
            export REPO_URL=https://mirrors.ustc.edu.cn/git/git-repo/git-repo
          else
            export REPO_DL=https://mirrors.tuna.tsinghua.edu.cn/git/git-repo
            export AOSP_MIRROR=https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/
            export REPO_URL=https://mirrors.tuna.tsinghua.edu.cn/git/git-repo
          fi

          # 下载repo工具，3次重试
          download_repo(){
            rm -f repo
            curl -fL $REPO_DL -o repo
          }
          for i in {1..3}; do
            if download_repo; then break; fi
            echo "repo下载失败，等待30s重试"
            sleep 30
          done
          chmod +x repo
          sudo mv repo /usr/local/bin/

          # Git全局替换AOSP地址
          git config --global user.name "CI Builder"
          git config --global user.email "ci@builder.local"
          git config --global url."$AOSP_MIRROR".insteadOf https://android.googlesource.com/
          echo "export REPO_URL=$REPO_URL" >> ~/.bashrc
        working-directory: ${{ env.workspace-folder }}

      - name: 初始化&同步源码（单线程防限流）
        run: |
          export REPO_URL=${{ env.REPO_URL }}
          cd ${{ env.workspace-folder }}
          mkdir -p arrow
          cd arrow

          # 关键修复：删掉 --depth=1 避免源码残缺
          repo init -u ${{ github.inputs.SYNC_URL }} -b ${{ github.inputs.MANIFEST_BRANCH }} --no-repo-verify
          mkdir -p .repo/local_manifests
          cp ../../repo-tmp/local_manifests/roomservice.xml .repo/local_manifests/

          # 5次同步重试
          MAX_RETRY=5
          for ((i=1; i<=MAX_RETRY; i++)); do
            echo "===== 第$i次同步尝试 ====="
            repo sync -j1 --force-sync --no-tags --no-clone-bundle --retry-fetches=15
            if [ $? -eq 0 ]; then
              echo "✅ 同步命令执行完成"
              break
            fi
            echo "同步失败，等待90s冷却"
            sleep 90
          done

          # 强制校验源码完整性（解决你当前报错核心）
          echo "校验源码目录文件："
          ls -la
          if [ ! -f build/envsetup.sh ]; then
            echo "❌ 致命错误：源码缺失 build/envsetup.sh，拉取源码不完整！"
            exit 1
          fi
          echo "✅ 源码完整校验通过"

      - name: 分配12G Swap 防编译OOM
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: 编译ROM
        run: |
          cd ${{ env.workspace-folder }}/arrow
          echo "当前源码目录内容："
          ls -la
          # 加载安卓编译环境
          source build/envsetup.sh
          lunch ${{ github.inputs.LUNCH_TARGET }}
          m otapackage -j4

      - name: 打包产物上传
        run: ls ${{ env.workspace-folder }}/arrow/out/target/product/${{ github.inputs.DEVICE_NAME }}/*.zip

      - name: 发布Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.workspace-folder }}/arrow/out/target/product/${{ github.inputs.DEVICE_NAME }}/*.zip
          tag_name: build-${{ github.inputs.MIRROR }}-${{ github.run_id }}
