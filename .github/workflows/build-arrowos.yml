name: Build ArrowOS (arrow-12.1)

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: 'Manifest repository URL'
        required: true
        default: 'https://github.com/ArrowOS/android_manifest.git'
      branch:
        description: 'Manifest branch (do NOT change)'
        required: true
        default: 'arrow-12.1'
      device:
        description: 'Device codename'
        required: true
        default: 'sky'
      lunch_target:
        description: 'Lunch target'
        required: true
        default: 'arrow_sky-userdebug'
      aosp_mirror:
        description: 'AOSP source mirror: tuna / ustc / official'
        required: true
        default: 'tuna'

env:
  BUILD_DIR: ${{ github.workspace }}/android
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
      # 0. 检出仓库（包含 local_manifests/roomservice.xml）
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 释放磁盘空间
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      # 2. 配置12G Swap，彻底规避fallocate占用报错
      - name: Configure 12GB swap (dd with /mnt fallback)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          SWAP_FILE=""
          echo "尝试根分区创建swap..."
          if sudo dd if=/dev/zero of=/swapfile bs=1M count=12288 status=progress; then
            SWAP_FILE="/swapfile"
          else
            sudo rm -f /swapfile
            sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=12288 status=progress
            SWAP_FILE="/mnt/swapfile"
          fi
          sudo chmod 600 "$SWAP_FILE"
          sudo mkswap "$SWAP_FILE"
          sudo swapon "$SWAP_FILE"
          echo "Swap文件：$SWAP_FILE"
          free -h

      # 3. JDK11 安卓12强制依赖
      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # 4. 核心修复：兼容Ubuntu24.04安装ncurses5旧库，解决找不到包报错
      - name: Install build dependencies and repo
        run: |
          # 加入Ubuntu22.04源，提供ncurses5兼容库
          echo "deb http://archive.ubuntu.com/ubuntu jammy main universe" | sudo tee /etc/apt/sources.list.d/jammy.list
          sudo apt-get update

          # 完整编译依赖，强制安装ncurses5兼容包
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses6 libncurses5 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig ccache rsync --allow-downgrades

          # repo工具安装兜底逻辑，彻底规避curl下载404
          if ! sudo apt-get install -y repo; then
            echo "apt无repo包，添加git-core PPA"
            sudo add-apt-repository -y ppa:git-core/ppa
            sudo apt-get update
            sudo apt-get install -y repo
          fi

          repo version
          git --version

      # 5. Git全局配置
      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false
          git config --global core.longpaths true
          git config --global safe.directory "*"

      # 6. Repo初始化，规避-b参数拦截问题
      - name: Repo init (without -b to avoid git pathname block)
        run: |
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          repo init -u "${{ github.event.inputs.manifest_url }}" --depth=1
          cd .repo/manifests
          git fetch origin "${{ github.event.inputs.branch }}"
          git checkout "${{ github.event.inputs.branch }}"
          echo "当前Manifest分支：$(git branch --show-current)"

      # 7. 复制设备roomservice.xml本地清单
      - name: Copy local manifests
        run: |
          if [ -d "${{ github.workspace }}/local_manifests" ]; then
            mkdir -p "$BUILD_DIR/.repo/local_manifests"
            cp -v "${{ github.workspace }}/local_manifests/"*.xml "$BUILD_DIR/.repo/local_manifests/"
            ls -la "$BUILD_DIR/.repo/local_manifests/"
          else
            echo "警告：仓库根目录未找到local_manifests文件夹，请确认roomservice.xml存在"
          fi

      # 8. AOSP国内镜像加速
      - name: Apply AOSP mirror
        run: |
          cd "$BUILD_DIR"
          MIRROR="${{ github.event.inputs.aosp_mirror }}"
          if [ "$MIRROR" = "tuna" ]; then
            find .repo/manifests -name "*.xml" -exec sed -i 's|https://android.googlesource.com|https://mirrors.tuna.tsinghua.edu.cn/git/AOSP|g' {} +
          elif [ "$MIRROR" = "ustc" ]; then
            find .repo/manifests -name "*.xml" -exec sed -i 's|https://android.googlesource.com|https://mirrors.ustc.edu.cn/aosp|g' {} +
          else
            echo "使用官方AOSP源"
          fi
          grep -r "fetch=" .repo/manifests/*.xml | head -20 || true

      # 9. 源码同步，3次自动重试
      - name: Repo sync (with 3 retries and integrity check)
        run: |
          cd "$BUILD_DIR"
          for i in 1 2 3; do
            echo "===== 第$i次同步源码 ====="
            if repo sync -c -j4 --force-sync --no-tags --no-clone-bundle; then
              echo "同步成功"
              break
            fi
            if [ "$i" -eq 3 ]; then
              echo "3次同步全部失败，退出"
              exit 1
            fi
            echo "同步失败，等待30秒重试"
            sleep 30
          done
          if [ ! -f "build/envsetup.sh" ]; then
            echo "源码不完整，缺少build/envsetup.sh"
            exit 1
          fi

      # 10. Ccache编译缓存加速
      - name: Setup ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          ccache -M 50G
          ccache -z

      # 11. 编译ROM
      - name: Build ArrowOS
        run: |
          cd "$BUILD_DIR"
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="$CCACHE_DIR"
          source build/envsetup.sh
          lunch "${{ github.event.inputs.lunch_target }}"
          m otapackage -j4

      # 12. 检索编译输出刷机包
      - name: Find output OTA zip
        id: find_zip
        run: |
          DEVICE="${{ github.event.inputs.device }}"
          ZIP_PATH=$(find "$BUILD_DIR/out/target/product/$DEVICE" -maxdepth 1 -name "*.zip" -type f | head -1)
          if [ -z "$ZIP_PATH" ]; then
            echo "未找到OTA刷机包"
            ls -la "$BUILD_DIR/out/target/product/$DEVICE/" 2>/dev/null
            exit 1
          fi
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "zip_name=$(basename "$ZIP_PATH")" >> "$GITHUB_OUTPUT"
          echo "找到刷机包：$ZIP_PATH"
          ls -lh "$ZIP_PATH"

      # 13. 自动发布Release
      - name: Upload OTA zip to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: arrowos-${{ github.event.inputs.device }}-${{ github.run_number }}
          name: ArrowOS ${{ github.event.inputs.device }} (${{ github.event.inputs.branch }}) #${{ github.run_number }}
          files: ${{ steps.find_zip.outputs.zip_path }}
          body: |
            ## ArrowOS 编译包
            - 设备代号：${{ github.event.inputs.device }}
            - 源码分支：${{ github.event.inputs.branch }}
            - Lunch编译目标：${{ github.event.inputs.lunch_target }}
            - 构建编号：${{ github.run_number }}
            - 仓库提交哈希：${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
